name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
    outputs:
      index:
        description: Validated publication destination, empty for manual checks
        value: ${{ jobs.validate.outputs.index }}
      version:
        description: Validated package version
        value: ${{ jobs.validate.outputs.version }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          version: "0.11.20"
      - run: uv venv
      # CPU builds keep Linux runners free of unnecessary CUDA dependencies.
      - run: uv pip install --torch-backend cpu ".[download]" pytest
      - run: uv run --no-sync pytest -m 'not integration'
      - run: uv run --no-sync python scripts/smoke_installed.py

  minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.10"
          version: "0.11.20"
      - run: uv venv
      - run: >-
          uv pip install --torch-backend cpu ".[download]" pytest
          torch==2.4.0 numpy==1.26.0 soundfile==0.12.0
          platformdirs==4.3.8 filelock==3.20.0
      - run: uv run --no-sync pytest -m 'not integration'
      - run: uv run --no-sync python scripts/smoke_installed.py

  validate:
    needs: [test, minimum]
    runs-on: macos-latest
    outputs:
      index: ${{ steps.metadata.outputs.index }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          version: "0.11.20"
      - run: uv sync --locked --extra download --group docs --group release
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ty check
      - run: uv build --no-sources --clear
      - run: uv run --no-sync twine check --strict dist/*.whl dist/*.tar.gz
      - id: metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: uv run --no-sync python scripts/check_release.py --tag "$RELEASE_TAG" --output "$GITHUB_OUTPUT"
      - name: Fresh base, download-extra, and sdist consumers
        run: |
          uv run --isolated --no-project --with dist/*.whl scripts/smoke_installed.py
          uv run --isolated --no-project --with "locata-torch[download] @ file://$PWD/dist/$(basename dist/*.whl)" scripts/smoke_installed.py
          uv run --isolated --no-project --with dist/*.tar.gz scripts/smoke_installed.py
      - run: uv run --no-sync zensical build --clean --strict
      - run: uv run --no-sync python scripts/check_docs_links.py site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
